{%extends 'expenses/basetemplate.html'%}
{%block content%}

<div class="text-center pt-5">
    <h1 class="text-6xl bg-gradient-to-r from-red-500 via-yellow-400 via-green-500 via-blue-500 via-indigo-500 via-purple-500 to-pink-500 text-transparent bg-clip-text italic">ExpenseStream</h1>
    <p class="text-white pl-60 italic">Your financial assistant</p>
    <div class="w-[28rem] h-80 backdrop-blur-lg rounded-2xl mt-[6rem] lg:w-[40rem] md:w-[28rem] text-center pt-5 border-2 border-indigo-400" >
<h2 class="mt-3  text-4xl text-white font-bold">Login</h2>
<form method="POST" class="p-5 space-y-5 text-lg text-white">
    {%csrf_token%}
    {{form.as_p}}
    <button type="submit" class="bg-green-700 rounded-2xl w-[8rem] h-10 text-xl text-white font-bold hover:bg-green-600 border-2 border-indigo-400 mt-10">Login</button>
</form>
<p class="text-lg text-white">Don't have an account? <a href="{% url 'sign_up' %}" class="text-blue-400 text-lg">Sign up</a></p>
</div>
</div> 
{%endblock%}
