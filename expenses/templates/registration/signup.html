{%extends 'expenses/basetemplate.html'%}
{%block content%}
<div class="text-center pt-5">
    <h1 class="text-6xl bg-gradient-to-r from-red-500 via-yellow-400 via-green-500 via-blue-500 via-indigo-500 via-purple-500 to-pink-500 text-transparent bg-clip-text italic">ExpenseStream</h1>
    <p class="text-white pl-60 italic">Your financial assistant</p>
<div class="w-[28rem] backdrop-blur-lg rounded-2xl lg:w-[50rem] mt-[6rem] md:w-[35rem] text-center pt-5 border-2 border-indigo-400" >
    <h2 class= "text-4xl text-white font-bold">Create Account</h2>
    <form method="POST" class="p-5 space-y-5 text-lg text-white">
    {%csrf_token%}
    {{form.as_p}}
    <button type="submit" class="bg-green-700 rounded-2xl w-[8rem] h-10 text-xl text-white font-bold hover:bg-green-600 border-2 border-indigo-400 mt-3">Sign Up</button>
    <p class="text-lg text-white">Already have an account? <a href="{% url 'login' %}" class="text-blue-400 text-lg">Login</a></p>

</form>
</div>
</div>
{%endblock%}
